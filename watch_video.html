<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAIOS — From Pixels to Reality</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background: linear-gradient(135deg, #05050f 0%, #0a0a2e 50%, #0f0520 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    padding: 20px;
  }
  .container { max-width: 900px; width: 100%; }
  h1 { 
    text-align: center; 
    font-size: 3em;
    background: linear-gradient(90deg, #00DCFF, #8B5CF6, #FF0080);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
    animation: glow 3s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.3); }
  }
  .subtitle {
    text-align: center;
    color: #8B5CF6;
    font-size: 1.2em;
    letter-spacing: 4px;
    margin-bottom: 40px;
  }
  .video-wrapper {
    position: relative;
    border: 2px solid rgba(0, 220, 255, 0.3);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0, 220, 255, 0.2), 
                0 0 80px rgba(139, 92, 246, 0.1),
                inset 0 0 30px rgba(0, 0, 0, 0.5);
    animation: border-pulse 4s ease-in-out infinite;
  }
  @keyframes border-pulse {
    0%, 100% { border-color: rgba(0, 220, 255, 0.3); }
    50% { border-color: rgba(139, 92, 246, 0.5); }
  }
  video { width: 100%; display: block; background: #000; }
  .info {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 30px;
    flex-wrap: wrap;
  }
  .badge {
    background: rgba(0, 220, 255, 0.1);
    border: 1px solid rgba(0, 220, 255, 0.3);
    padding: 8px 20px;
    border-radius: 25px;
    color: #00DCFF;
    font-size: 0.9em;
    backdrop-filter: blur(10px);
  }
  .download-btn {
    display: inline-block;
    margin-top: 25px;
    padding: 14px 30px;
    background: linear-gradient(90deg, #00DCFF, #8B5CF6);
    color: white;
    text-decoration: none;
    border-radius: 30px;
    font-weight: 600;
    font-size: 1em;
    transition: transform 0.3s, box-shadow 0.3s;
    border: none;
    cursor: pointer;
  }
  .download-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(0, 220, 255, 0.5);
  }
  .footer {
    text-align: center;
    margin-top: 40px;
    color: rgba(255, 255, 255, 0.3);
    font-size: 0.85em;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>GAIOS</h1>
    <div class="subtitle">FROM PIXELS TO REALITY</div>
    
    <div class="video-wrapper">
      <video controls autoplay preload="metadata">
        <source src="gaios_3dprint_video.mp4" type="video/mp4">
        Your browser doesn't support HTML5 video. Try Chrome or Firefox.
      </video>
    </div>
    
    <div class="info">
      <span class="badge">🎬 1920x1080</span>
      <span class="badge">⏱️ 30s</span>
      <span class="badge">🎵 Cyberpunk</span>
      <span class="badge">3D Print Story</span>
    </div>
    
    <div style="text-align: center;">
      <a href="gaios_3dprint_video.mp4" download class="download-btn">
        📥 Download Video
      </a>
    </div>
    
    <div class="footer">© 2026 GAIOS — Generated on DGX Spark</div>
  </div>
</body>
</html>
